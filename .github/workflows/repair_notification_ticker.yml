name: Repair notification ticker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair notification ticker speed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified UI and slow ticker
        shell: bash
        run: |
          git checkout 5e4ad896f044605ad97327a04a5053185b297f38 -- frontend/app/ui/main_window.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/app/ui/main_window.py')
          text = path.read_text(encoding='utf-8')
          old = 'self._notification_timer.start(120)'
          new = 'self._notification_timer.start(6000)'
          if old not in text:
              raise SystemExit('Expected notification timer was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/repair_notification_ticker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/ui/main_window.py .github/workflows/repair_notification_ticker.yml
          git commit -m 'Repair notification ticker speed'
          git push
