name: Build Windows Installer
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow opencv-python pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path backend/requirements.txt) { pip install -r backend/requirements.txt }
          if (Test-Path frontend/requirements.txt) { pip install -r frontend/requirements.txt }

      - name: Build EXEs
        run: |
          pyinstaller --noconfirm --onefile --windowed --name GroceryManagementSystem frontend/app/main.py
          if (Test-Path license_manager.py) { pyinstaller --noconfirm --onefile --windowed --name GroceryLicenseManager license_manager.py }

      - name: Prepare installer folder
        run: |
          dir dist
          Copy-Item dist\*.exe -Destination installer\ -Force
          dir installer

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          iscc installer/GroceryManagementSystem.iss
          dir installer/Output

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-Setup
          path: installer/Output/*.exe
