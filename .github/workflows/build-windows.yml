name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path backend/requirements.txt) { pip install -r backend/requirements.txt }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name GroceryManagementSystem --distpath dist --workpath build --specpath . run.py
          dir dist
          if (!(Test-Path dist\GroceryManagementSystem.exe)) { throw "EXE not found!" }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          Copy-Item dist\GroceryManagementSystem.exe -Destination . -Force
          iscc installer\grocerymanagementsystem.iss
          dir installer\Output

      - name: Upload Windows Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Setup
          path: installer/Output/*.exe
