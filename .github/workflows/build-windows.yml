name: windows-build
on:
  push:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow opencv-python pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name GroceryManagementSystem frontend/app/main.py

      - name: Prepare folders
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path installer/Output | Out-Null
          New-Item -ItemType Directory -Force -Path client/package | Out-Null
          Copy-Item dist/GroceryManagementSystem.exe -Destination client/package/ -Force
          Copy-Item dist/GroceryManagementSystem.exe -Destination installer/ -Force
          if (Test-Path assets/GroceryManagementSystem.ico) { Copy-Item assets/GroceryManagementSystem.ico -Destination client/package/ -Force }

      - name: Create desktop shortcut in client package
        shell: powershell
        run: |
          $wsh = New-Object -comObject WScript.Shell
          $lnk = $wsh.CreateShortcut("$PWD/client/package/Grocery Management System.lnk")
          $lnk.TargetPath = "$PWD/client/package/GroceryManagementSystem.exe"
          $lnk.WorkingDirectory = "$PWD/client/package"
          $lnk.Save()

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Setup installer
        run: |
          iscc installer/GroceryManagementSystem.iss

      - name: Upload Windows Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-Setup
          path: installer/Output/*.exe

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: client/package/
