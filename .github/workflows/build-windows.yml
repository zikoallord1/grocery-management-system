name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run full test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name GroceryManagementSystem --paths . run.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GroceryManagementSystem/GroceryManagementSystem.exe')) { throw 'Windows executable was not produced.' }
          Get-Item 'dist/GroceryManagementSystem/GroceryManagementSystem.exe' | Select-Object FullName, Length

      - name: Package distribution
        shell: pwsh
        run: Compress-Archive -Path 'dist/GroceryManagementSystem/*' -DestinationPath 'dist/GroceryManagementSystem-Windows.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GroceryManagementSystem-Windows
          path: dist/GroceryManagementSystem-Windows.zip
          if-no-files-found: error
