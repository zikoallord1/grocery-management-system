name: windows-build
on:
  push:
    paths:
      - 'frontend/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install customtkinter pillow opencv-python pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name GroceryManagementSystem frontend/app/main.py
      - name: Prepare
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Copy-Item dist/GroceryManagementSystem.exe -Destination installer/ -Force
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: iscc installer/GroceryManagementSystem.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-Setup
          path: installer/Output/*.exe
