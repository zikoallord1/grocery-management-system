name: Build Windows Installer
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=assets/GroceryManagementSystem.ico --name=GroceryManagementSystem run.py
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Setup installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/GroceryManagementSystem.iss"
          if (!(Test-Path "installer-output/GroceryManagementSystem-Setup.exe")) { throw "Setup installer was not created" }
      - name: Upload Windows Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: GroceryManagementSystem-Setup
          path: installer-output/GroceryManagementSystem-Setup.exe
