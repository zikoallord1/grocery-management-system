name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt and barcode runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libpulse0 libzbar0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  windows-build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build documentation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/build_documentation.py

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --add-data "build_docs;docs" --name GroceryManagementSystem run.py

      - name: Build license manager executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GroceryLicenseManager license_manager.py

      - name: Prepare client package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path client-package | Out-Null
          Copy-Item dist/GroceryManagementSystem.exe client-package/
          Copy-Item dist/GroceryLicenseManager.exe client-package/
          Copy-Item "build_docs/دليل استخدام البرنامج.pdf" client-package/
          Copy-Item "build_docs/تقرير البرنامج.pdf" client-package/
          Copy-Item "build_docs/معلومات الإصدار.txt" client-package/
          Copy-Item "build_docs/screens" client-package/صور-الشرح -Recurse
          @"
          Grocery Management System V1.0

          Client package contents:
          - GroceryManagementSystem.exe - Main application
          - GroceryLicenseManager.exe - License manager
          - دليل استخدام البرنامج.pdf - Illustrated user manual
          - تقرير البرنامج.pdf - Illustrated program report
          - صور-الشرح - Real interface screenshots
          - معلومات الإصدار.txt - Version and support information

          Security notice:
          The private license signing key must remain with the license administrator.
          Never distribute the private signing key to customers.
          "@ | Set-Content -Path client-package/README.txt -Encoding UTF8

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: GroceryManagementSystem-Windows
          path: dist/GroceryManagementSystem.exe

      - name: Upload license manager
        uses: actions/upload-artifact@v4
        with:
          name: GroceryLicenseManager-Windows
          path: dist/GroceryLicenseManager.exe

      - name: Upload complete client package
        uses: actions/upload-artifact@v4
        with:
          name: GroceryManagementSystem-ClientPackage
          path: client-package
