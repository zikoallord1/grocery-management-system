name: Build Windows Installer

on:
  push:
    branches:
      - mobile-android-cameras
      - integration-ui-installer-kiosk
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw 'Python launcher not found on build runner.' }
          py -3.11 --version

      - name: Install application dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install --disable-pip-version-check -r backend/requirements.txt
          py -3.11 -m pip install --disable-pip-version-check 'pyinstaller>=6,<7'

      - name: Build bundled standalone executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          py -3.11 -m PyInstaller --noconfirm --clean --onefile --windowed --name GroceryManagementSystem run.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller main app failed with exit code $LASTEXITCODE" }
          py -3.11 -m PyInstaller --noconfirm --clean --onefile --console --name GroceryLicenseManager license_manager.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller license manager failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'dist/GroceryManagementSystem.exe')) { throw 'Main application executable was not produced.' }
          if (-not (Test-Path 'dist/GroceryLicenseManager.exe')) { throw 'License manager executable was not produced.' }

      - name: Verify bundled executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-Item 'dist/GroceryManagementSystem.exe'
          $license = Get-Item 'dist/GroceryLicenseManager.exe'
          if ($app.Length -lt 10000000) { throw "Main EXE is unexpectedly small: $($app.Length) bytes" }
          if ($license.Length -lt 1000000) { throw "License EXE is unexpectedly small: $($license.Length) bytes" }
          Write-Host "MAIN EXE: $($app.Length) bytes"
          Write-Host "LICENSE EXE: $($license.Length) bytes"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is required to install Inno Setup 7.' }
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements
          $candidates = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ }
          if (-not $candidates) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          "ISCC=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using ISCC: $($candidates[0])"

      - name: Compile real Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist/GroceryManagementSystem-Setup.exe) { Remove-Item dist/GroceryManagementSystem-Setup.exe -Force }
          & $env:ISCC 'installer/GroceryManagementSystem.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify real installer
        shell: pwsh
        run: |
          $setup = Get-Item 'dist/GroceryManagementSystem-Setup.exe' -ErrorAction Stop
          if ($setup.Length -lt 10000000) { throw "Installer is unexpectedly small: $($setup.Length) bytes" }
          Write-Host "REAL WINDOWS INSTALLER: $($setup.FullName)"
          Write-Host "SIZE: $($setup.Length) bytes"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Windows-Setup
          path: dist/GroceryManagementSystem-Setup.exe
          if-no-files-found: error
