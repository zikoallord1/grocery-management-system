name: UI Validation

on:
  push:
    paths:
      - '.github/workflows/ui_refinement.yml'
      - 'frontend/app/ui/main_window.py'
      - 'frontend/app/ui/sales_page.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python UI
        run: python -m compileall -q frontend backend

      - name: Verify reference layout contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app/ui/main_window.py')
          text = p.read_text(encoding='utf-8')
          required = [
              'Reference RTL workspace: content LEFT, navigation RIGHT',
              'shell.setDirection(QHBoxLayout.RightToLeft)',
              'shell.addWidget(content_panel, 1)',
              'shell.addWidget(nav_scroll, 0)',
              'self._notification_timer.start(28)',
              'self._notification_label',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Reference layout contract failed: ' + repr(missing))
          if 'nav_scroll.setFixedWidth(196)' not in text:
              raise SystemExit('Right-side navigation width contract failed')
          print('Reference layout contract: PASS')
          PY
