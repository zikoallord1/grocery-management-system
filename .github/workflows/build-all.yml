name: Build All Release Artifacts

on:
  push:
    branches:
      - mobile-android-cameras
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

concurrency:
  group: grocery-final-build-manual
  cancel-in-progress: true

jobs:
  build-all:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Python 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCmd = Get-Command python -ErrorAction SilentlyContinue
          if (-not $pythonCmd) { $pythonCmd = Get-Command py -ErrorAction SilentlyContinue }
          if ($pythonCmd) {
            $candidate = $pythonCmd.Source
            if (-not $candidate) { $candidate = $pythonCmd.Path }
            try {
              $v = & $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" 2>$null
              if ($v -eq '3.11') {
                & $candidate --version
                "GROCERY_PYTHON=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                exit 0
              }
            } catch {}
          }

          $portableRoot = Join-Path $env:RUNNER_TEMP 'python311'
          $zipPath = Join-Path $env:RUNNER_TEMP 'python311-embed.zip'
          if (-not (Test-Path (Join-Path $portableRoot 'python.exe'))) {
            if (Test-Path $portableRoot) { Remove-Item $portableRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
            Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $portableRoot -Force
          }

          $pth = Get-ChildItem $portableRoot -Filter 'python311._pth' -File | Select-Object -First 1
          if (-not $pth) { throw 'Portable Python _pth file was not found.' }
          $pthText = Get-Content $pth.FullName -Raw
          if ($pthText -notmatch '(?m)^import site\s*$') {
            Add-Content -Path $pth.FullName -Value "`r`nimport site`r`n"
          }

          $portablePython = Join-Path $portableRoot 'python.exe'
          if (-not (Test-Path $portablePython)) { throw 'Portable Python executable was not created.' }

          if (-not (Test-Path (Join-Path $portableRoot 'Scripts\pip.exe'))) {
            $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
            Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/pip/3.11/get-pip.py' -OutFile $getPip
            & $portablePython $getPip --disable-pip-version-check
            if ($LASTEXITCODE -ne 0) { throw "Portable pip bootstrap failed: $LASTEXITCODE" }
          }

          & $portablePython --version
          & $portablePython -m pip --version
          "GROCERY_PYTHON=$portablePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify runner tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GROCERY_PYTHON) { throw 'GROCERY_PYTHON was not prepared.' }
          if (-not (Test-Path $env:GROCERY_PYTHON)) { throw "Python executable missing: $env:GROCERY_PYTHON" }
          $version = & $env:GROCERY_PYTHON -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($version -ne '3.11') { throw "Python 3.11 required, found $version at $env:GROCERY_PYTHON" }
          & $env:GROCERY_PYTHON --version
          java -version

      - name: Install and verify Windows runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GROCERY_PYTHON -m pip install --disable-pip-version-check -r backend/requirements.txt
          & $env:GROCERY_PYTHON -c "import PySide6; print('PySide6:', PySide6.__version__)"
          & $env:GROCERY_PYTHON -c "import sqlalchemy, cryptography, reportlab; print('Core runtime imports: OK')"
          & $env:GROCERY_PYTHON -m PyInstaller --version

      - name: Build Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          & $env:GROCERY_PYTHON -m PyInstaller --noconfirm --onefile --windowed --name GroceryManagementSystem run.py
          if ($LASTEXITCODE -ne 0) { throw "Main PyInstaller build failed: $LASTEXITCODE" }
          & $env:GROCERY_PYTHON -m PyInstaller --noconfirm --onefile --console --name GroceryLicenseManager license_manager.py
          if ($LASTEXITCODE -ne 0) { throw "License PyInstaller build failed: $LASTEXITCODE" }
          if (-not (Test-Path 'dist/GroceryManagementSystem.exe')) { throw 'Main executable missing.' }
          if (-not (Test-Path 'dist/GroceryLicenseManager.exe')) { throw 'License executable missing.' }
          $main = Get-Item 'dist/GroceryManagementSystem.exe'
          $license = Get-Item 'dist/GroceryLicenseManager.exe'
          if ($main.Length -lt 10000000) { throw "Main EXE unexpectedly small: $($main.Length)" }
          if ($license.Length -lt 10000000) { throw "License EXE unexpectedly small: $($license.Length)" }
          Write-Host "MAIN EXE: $($main.Length) bytes"
          Write-Host "LICENSE EXE: $($license.Length) bytes"

      - name: Smoke test standalone executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/GroceryManagementSystem.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Standalone application exited during smoke test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'Standalone EXE smoke test: PASSED'

      - name: Build real Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isccCandidates = @(
            'C:\Users\Ziko\AppData\Local\Programs\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found on the self-hosted runner.' }
          & $iscc 'installer/GroceryManagementSystem.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = Get-Item 'dist/GroceryManagementSystem-Setup.exe' -ErrorAction Stop
          if ($setup.Length -lt 10000000) { throw "Installer unexpectedly small: $($setup.Length) bytes" }
          Write-Host "SETUP EXE: $($setup.Length) bytes"

      - name: Smoke test installer and installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'grocery-installer-smoke'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $installDir = Join-Path $testRoot 'app'
          $setup = (Resolve-Path 'dist/GroceryManagementSystem-Setup.exe').Path
          $installer = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }
          $installedExe = Join-Path $installDir 'GroceryManagementSystem.exe'
          if (-not (Test-Path $installedExe)) { throw "Installed EXE missing: $installedExe" }
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed application exited during smoke test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'Installer installation + installed EXE smoke test: PASSED'

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Windows-Release
          path: |
            dist/GroceryManagementSystem-Setup.exe
            dist/GroceryManagementSystem.exe
            dist/GroceryLicenseManager.exe
          if-no-files-found: error