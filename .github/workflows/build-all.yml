name: Build All Release Artifacts

on:
  workflow_dispatch:

concurrency:
  group: grocery-final-build-manual
  cancel-in-progress: true

jobs:
  build-all:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 --version
          java -version
