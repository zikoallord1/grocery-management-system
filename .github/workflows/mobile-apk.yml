name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android project
        shell: bash
        run: |
          test -f mobile/settings.gradle.kts
          test -f mobile/build.gradle.kts
          test -f mobile/app/build.gradle.kts
          test -f mobile/app/src/main/AndroidManifest.xml
          echo "Android project structure OK"

      - name: Build APK
        shell: bash
        working-directory: mobile
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f mobile/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mobile/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nizam-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
