name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-android-cameras]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

concurrency:
  group: grocery-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          sdkmanager 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: mobile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gradle --no-daemon --stacktrace :app:assembleDebug
          $apk=Resolve-Path 'app\build\outputs\apk\debug\app-debug.apk' -ErrorAction Stop
          if((Get-Item $apk).Length -lt 100000){throw 'APK unexpectedly small'}
          Write-Host "APK: $apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Android-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
