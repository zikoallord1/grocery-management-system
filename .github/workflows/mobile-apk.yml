name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-android-cameras
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

concurrency:
  group: grocery-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s mobile/app/build/outputs/apk/debug/app-debug.apk
          size=$(stat -c%s mobile/app/build/outputs/apk/debug/app-debug.apk)
          test "$size" -ge 100000
          echo "APK size: $size bytes"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Android-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
