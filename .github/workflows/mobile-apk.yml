name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          ls -la
          if [ -f package.json ]; then
            npm install && npm run build && npx cap sync android
          elif [ -f frontend/package.json ]; then
            cd frontend && npm install && npm run build && npx cap sync android && cd ..
          elif [ -f mobile/package.json ]; then
            cd mobile && npm install && npm run build && npx cap sync android && cd ..
          else
            echo "No package.json found in root/frontend/mobile"
            find . -maxdepth 3 -name package.json
            exit 1
          fi
      - name: Build APK
        run: |
          if [ -d android ]; then cd android; elif [ -d frontend/android ]; then cd frontend/android; elif [ -d mobile/android ]; then cd mobile/android; fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nizam-APK
          path: "**/app-debug.apk"
