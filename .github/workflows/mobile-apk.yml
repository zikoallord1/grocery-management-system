name: Build Android APK

on:
  push:
    branches:
      - mobile-android-cameras
      - integration-ui-installer-kiosk
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradleRoot = Join-Path $env:RUNNER_TEMP 'gradle-8.11.1'
          $gradleBin = Join-Path $gradleRoot 'bin'
          if (-not (Test-Path (Join-Path $gradleBin 'gradle.bat'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'gradle-8.11.1-bin.zip'
            Invoke-WebRequest -Uri 'https://services.gradle.org/distributions/gradle-8.11.1-bin.zip' -OutFile $zip
            if (Test-Path $gradleRoot) { Remove-Item $gradleRoot -Recurse -Force }
            Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          }
          $env:GRADLE_HOME = $gradleRoot
          $env:PATH = "$gradleBin;$env:PATH"
          "GRADLE_HOME=$gradleRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$gradleBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $gradleBin 'gradle.bat') --version

      - name: Configure existing Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkCandidates = @(
            "$env:LOCALAPPDATA\Android\Sdk",
            "$env:USERPROFILE\.android\sdk",
            "$env:ANDROID_HOME",
            "$env:ANDROID_SDK_ROOT"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $sdkCandidates) { throw 'Android SDK was not found on the build runner.' }
          $sdk = $sdkCandidates[0]
          $sdkManager = Get-ChildItem -Path $sdk -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdk" }
          $sdkBin = Split-Path $sdkManager.FullName -Parent
          $env:ANDROID_HOME = $sdk
          $env:ANDROID_SDK_ROOT = $sdk
          $env:PATH = "$sdkBin;$sdk\platform-tools;$env:PATH"
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$sdkBin;$sdk\platform-tools;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Android SDK: $sdk"
          & $sdkManager.FullName --version
          & $sdkManager.FullName --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android project
        shell: pwsh
        run: gradle --version

      - name: Build debug APK
        shell: pwsh
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        shell: pwsh
        run: |
          if (-not (Test-Path "app/build/outputs/apk/debug/app-debug.apk")) { throw "APK was not produced" }
          if ((Get-Item "app/build/outputs/apk/debug/app-debug.apk").Length -le 0) { throw "APK is empty" }
          Write-Host "APK ready: app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Mobile-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
