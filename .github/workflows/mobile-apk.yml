name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-android-cameras
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

concurrency:
  group: grocery-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Android toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          java -version
          $candidates = @($env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'),'C:\Android\Sdk','C:\Users\Ziko\AppData\Local\Android\Sdk') | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $sdk = $candidates | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found in environment or standard Windows locations.' }
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ANDROID SDK: $sdk"

      - name: Prepare Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkmanager = Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) { $sdkmanager = Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools\bin\sdkmanager.bat' }
          if (-not (Test-Path $sdkmanager)) { $sdkmanager = Join-Path $env:ANDROID_SDK_ROOT 'tools\bin\sdkmanager.bat' }
          if (Test-Path $sdkmanager) {
            & $sdkmanager 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Android SDK package preparation failed: $LASTEXITCODE" }
          } else { Write-Host 'sdkmanager not found; using installed SDK packages.' }

      - name: Prepare Gradle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = Get-Command gradle -ErrorAction SilentlyContinue
          if ($gradle) { gradle --version; exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'gradle-8.11.1-bin.zip'
          $home = Join-Path $env:RUNNER_TEMP 'gradle-8.11.1'
          if (-not (Test-Path (Join-Path $home 'bin\gradle.bat'))) {
            Invoke-WebRequest -Uri 'https://services.gradle.org/distributions/gradle-8.11.1-bin.zip' -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          }
          "GRADLE_HOME=$home" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$home\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$home\bin\gradle.bat" --version

      - name: Build debug APK
        shell: pwsh
        working-directory: mobile
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = Get-Command gradle -ErrorAction SilentlyContinue
          if ($gradle) { & $gradle.Source --no-daemon --stacktrace :app:assembleDebug } else { & "$env:GRADLE_HOME\bin\gradle.bat" --no-daemon --stacktrace :app:assembleDebug }
          if ($LASTEXITCODE -ne 0) { throw "Android build failed: $LASTEXITCODE" }
          $apk = Resolve-Path 'app\build\outputs\apk\debug\app-debug.apk' -ErrorAction Stop
          if ((Get-Item $apk).Length -lt 100000) { throw 'APK unexpectedly small.' }
          Write-Host "APK: $apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Android-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
