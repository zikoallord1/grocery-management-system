name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-android-cameras]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

concurrency:
  group: grocery-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java and Android tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          java -version
          if (-not (Get-Command sdkmanager -ErrorAction SilentlyContinue)) {
            throw 'sdkmanager is not available on the self-hosted runner.'
          }
          sdkmanager --version

      - name: Install Android packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          sdkmanager 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: mobile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gradle --no-daemon --stacktrace :app:assembleDebug
          $apk=Resolve-Path 'app\build\outputs\apk\debug\app-debug.apk' -ErrorAction Stop
          $size=(Get-Item $apk).Length
          if($size -lt 100000){throw "APK unexpectedly small: $size bytes"}
          Write-Host "APK: $apk ($size bytes)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nizam-Al-Baqala-Android-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
