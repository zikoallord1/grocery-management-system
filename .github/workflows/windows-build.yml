name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pydantic-settings python-dotenv pillow opencv-python pyinstaller cryptography

      - name: Verify application imports
        shell: powershell
        run: python -c "from frontend.app.main import *; print('Application import OK')"

      - name: Build EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GroceryManagementSystem --paths . frontend/app/main.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path 'dist/GroceryManagementSystem.exe')) { throw 'PyInstaller EXE was not created.' }
          Get-Item 'dist/GroceryManagementSystem.exe' | Format-List FullName,Length

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Setup
        shell: powershell
        run: iscc installer/GroceryManagementSystem.iss

      - name: Verify Setup
        shell: powershell
        run: |
          $setup = Get-ChildItem 'installer/Output/*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe was not created.' }
          $setup | Format-List FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-Setup
          path: installer/Output/*.exe
