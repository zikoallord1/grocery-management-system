name: windows-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install customtkinter pillow opencv-python pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name GroceryManagementSystem frontend/app/main.py
      - name: Copy EXE to installer
        shell: powershell
        run: Copy-Item dist/GroceryManagementSystem.exe -Destination installer/ -Force
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Setup
        run: iscc installer/GroceryManagementSystem.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-Setup
          path: installer/Output/*.exe
